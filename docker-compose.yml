version: "3.8"

services:
  db:
    image: postgres:10-alpine
    container_name: postgres_odoo_base
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:14
    container_name: odoo_fitdnu
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_webdata:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    restart: unless-stopped

volumes:
  odoo_pgdata:
  odoo_webdata:

